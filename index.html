<head>

  <meta charset="UTF-8">

  <meta name="description" content="دلّيني — الملاحة والطرق والبلاغات في العراق">
  <meta name="theme-color" content="#087e76">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    // لا نعرض إعلان تثبيت Chrome الأصلي؛ التطبيق يعرض خياراته الخاصة.
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
    }, { capture: true });

    // منع تكبير صفحة Safari نفسها مع ترك إيماءات الخريطة لـ Flutter.
    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    }, { passive: false });
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      -webkit-text-size-adjust: 100%;
      background: #0b1918;
    }

    body, flt-glass-pane {
      touch-action: none;
    }
  </style>
</head>
