<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دلّيني | مشاركة موقع</title><link rel="icon" href="dlinii_icon.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;font-family:Tahoma,Arial;color:#effff8;background:radial-gradient(ellipse at top,#176b59,#081d21 70%)}main{width:min(100%,420px);padding:36px 26px;border:1px solid #ffffff30;border-radius:32px;background:#ffffff10;backdrop-filter:blur(24px);box-shadow:0 30px 90px #0005;text-align:center}img{width:96px;height:96px;border-radius:24px}p{color:#bdd6ce;line-height:1.8}a{display:block;padding:17px;margin-top:12px;border-radius:16px;color:inherit;background:#ffffff12;text-decoration:none;font-weight:bold}a:first-of-type{background:#7ce0be;color:#102f29}a:focus-visible{outline:3px solid #efbb52}a[aria-disabled=true]{pointer-events:none;opacity:.4}</style></head><body><main><img src="dlinii_icon.png" alt="أيقونة دلّيني"><h1>دلّيني</h1><p id="message">صديقك يشاركك الطريق. اختر طريقة المتابعة.</p><a id="web">الاستمرار في المتصفح 🌐</a><a id="app">فتح تطبيق دلّيني 🚘</a><a href="https://play.google.com/store/apps/details?id=com.dlinii.app">تحميل من Google Play 📥</a></main><script>
const q=new URLSearchParams(location.search),lat=Number(q.get('lat')),lng=Number(q.get('lng'));
const valid=q.has('lat')&&q.has('lng')&&q.get('lat').trim()!==''&&q.get('lng').trim()!==''&&Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180;
if(valid){const params=new URLSearchParams({lat:String(lat),lng:String(lng),mode:q.get('mode')==='myloc'?'myloc':'guide',name:q.get('name')||''});document.getElementById('web').href='/?'+params;document.getElementById('app').href=/android/i.test(navigator.userAgent)?'intent://s?'+params+'#Intent;scheme=dlinii;package=com.dlinii.app;S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id=com.dlinii.app')+';end':'dlinii://s?'+params;}else{document.getElementById('message').textContent='رابط الموقع غير صالح أو غير مكتمل.';for(const id of ['web','app'])document.getElementById(id).setAttribute('aria-disabled','true');}
</script></body></html>
